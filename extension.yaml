  data_migrations: []
extension_id: flowsteward.google-cloud-vertex
kind: tool_provider
version: 0.1.0
release_stage: active
display_name: Google Cloud Vertex Gemini
description: Connect Gemini models hosted by Vertex AI to Flow Steward.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-ai-google-cloud-vertex/issues
  website_url: https://github.com/Flow-Steward/ext-ai-google-cloud-vertex
listing:
  category: ai
  tags:
  - llm
  - google-cloud
  - vertex-ai
  summary: Connect an account-scoped Google Cloud project and discover Gemini models.
features:
- tool
- llm_provider
egress:
  hosts:
  - "*.googleapis.com"
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_vertex
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: account
  description: Vertex project, location, and credentials belong to this Flow Steward
    account.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
