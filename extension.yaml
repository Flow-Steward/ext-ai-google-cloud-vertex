runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.4.0
  extension_contract_v2:
    llm_provider:
      schema_version: llm_provider_extension_v1
      supplier_key: google_cloud_vertex
      supplier_label: Google Cloud Vertex
      runtime_mode: subprocess
      credential_provider_key: google_cloud_vertex
      required_provider_secrets:
      - service_account_json
      required_connection_config:
      - project_id
      - location
      connection_config_schema:
        project_id:
          type: string
          title: Google Cloud project
          minLength: 6
          maxLength: 30
        location:
          type: string
          title: Vertex AI location
          minLength: 1
          maxLength: 63
      connection_config_help:
        project_id: The billed Google Cloud project ID (6-30 characters) or project
          number (6-20 digits) where Vertex AI is enabled.
        location: A supported Vertex location such as us-central1 or global; availability
          varies by model.
      provider_secret_formats:
        service_account_json: json_object
      provider_secret_help:
        service_account_json: Paste the full JSON key for a dedicated Google Cloud
          service account with Vertex AI access. Store it securely and rotate it according
          to your policy.
      operations:
        list_models:
          query_id: llm.list_models
        chat:
          action_id: llm.chat
        structured_chat:
          action_id: llm.chat_structured
          optional: true
      model_grouping:
        strategy: upstream_owner
        owner_key_field: upstream_owner_key
        owner_label_field: upstream_owner_label
      required_capabilities_for_enablement:
      - chat
      - tools
      - structured_output
