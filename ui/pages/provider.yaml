page_id: provider
title: Google Cloud Vertex Gemini
description: >-
  Connect a Google Cloud project with a service-account JSON key, then discover and add the
  Gemini models your project can use in the location you choose.
components:
  - component_id: setup_project
    type: markdown
    title: 1. Google Cloud project
    body: |
      Create or choose a project in the [Google Cloud console](https://console.cloud.google.com/projectcreate).

      Projects inside a Google Workspace or Cloud organization usually have the policy
      `iam.disableServiceAccountKeyCreation`, which blocks the JSON key from step 5. Use a project
      outside the organization, or ask your organization administrator to allow service-account
      keys for this project.

      Your **Project ID** is shown on the project dashboard and in the JSON key as `project_id`.
  - component_id: setup_billing
    type: markdown
    title: 2. Billing
    body: |
      Link a billing account to the project:
      `https://console.cloud.google.com/billing/linkedaccount?project=<your-project-id>`.

      The newest Gemini models (Gemini 3 and later) need a full paid billing account. On a Free
      trial billing account Google refuses them; upgrading the account keeps any remaining trial
      credit.
  - component_id: setup_api
    type: markdown
    title: 3. Vertex AI API
    body: |
      Open [Vertex AI API](https://console.cloud.google.com/apis/library/aiplatform.googleapis.com)
      for your project and select **Enable**.
  - component_id: setup_service_account
    type: markdown
    title: 4. Service account
    body: |
      In [Service Accounts](https://console.cloud.google.com/iam-admin/serviceaccounts) select
      **Create service account**, give it a name, and grant it the role **Agent Platform User**
      (formerly Vertex AI User, `roles/aiplatform.user`). Tip: type `aiplatform.user` in the role
      search.
  - component_id: setup_key
    type: markdown
    title: 5. JSON key
    body: |
      Open the service account, go to **Keys** → **Add key** → **Create new key** → **JSON**. The
      browser downloads the key file once; keep it private.
  - component_id: setup_fields
    type: markdown
    title: 6. Fields in Flow Steward
    body: |
      - **Project ID** — the `project_id` from the JSON key.
      - **Location** — we recommend `global`: the newest Gemini models are served there. The
        location is the Google data center that runs the model, not where you are.
      - **Service account key** — paste the whole JSON file.

      Save the provider.
  - component_id: setup_discover
    type: markdown
    title: 7. Discover and add models
    body: |
      **Discover** lists only the Gemini chat models your project can use in the chosen location;
      it checks each model with Google's free token count and never generates text. **Add** runs
      Flow Steward's capability check on a model before your agents can use it.
  - component_id: setup_troubleshooting
    type: markdown
    title: If it doesn't work
    body: |
      - **"The provider rejected the API key…"** — check the JSON key (copied whole, not
        revoked), that the Vertex AI API is enabled for the project, and that the service account
        has Agent Platform User (`roles/aiplatform.user`).
      - **"Google Cloud Vertex refused this model: your plan doesn't include it…"** or **"The
        provider account has insufficient quota or credit."** — the project has no linked billing
        account, or it is a Free trial account and the model needs a paid one (step 2).
      - **"The selected model is unavailable."** — the model is not served to your project in this
        location. Set Location to `global` and discover again.
      - **"The selected model does not satisfy the required chat capabilities."** — the model is
        not a chat model (for example speech or image); choose another one.
      - **"The provider is rate limited. Try again later."** — Google's quota for the project was
        reached; wait and try again, or raise the quota in the Google Cloud console.
